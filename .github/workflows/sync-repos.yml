name: Sync navbar repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "12 6 * * *"

permissions:
  contents: write

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh forpublicai repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: forpublicai
        run: python3 scripts/sync_repos.py

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(repos): refresh navbar repository activity"
          file_pattern: _data/forpublicai_repos.yml
