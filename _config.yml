markdown: kramdown
theme: minima
title: Public AI Network
description: A coalition to build public AI
url: "https://publicai.network"
author:
  name: Public AI Network
  email: info@publicai.network

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Theme-specific settings

minima:
  nav_pages:
  - libraries.md
  - seminar.md
  - contributing.md
  - publications.md
  - news.md
  - opportunities/index.md
  # Set to `true` to show excerpts on the homepage.
  show_excerpts: true

collections:
  jobs:
    output: true
    permalink: /jobs/:name/

defaults:
  - scope:
      path: ""
      type: jobs
    values:
      layout: page

google_analytics: G-8CM1DYG2FB

# see https://github.com/jekyll/minima/blob/master/_config.yml for examples

# progress/ is the forpublicai/progress subtree. progress.html pulls in its
# prebuilt fragment with include_relative, and the social card is published
# from progress/static/dist/card.png. Everything else in it stays unpublished.
# Jekyll 3 matches these with fnmatch, where * also crosses /, so name paths.
exclude:
  - progress/collectors/
  - progress/data/
  - progress/react/
  - progress/records/
  - progress/snapshots/
  - progress/static/*.tsx
  - progress/static/*.mjs
  - progress/static/dist/*.html
  - progress/README.md
  - progress/HANDOFF.md
  - progress/build.py
  - progress/metrics.json
  - progress/package.json
  - progress/package-lock.json
  - progress/tsconfig.json
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .bundle/
