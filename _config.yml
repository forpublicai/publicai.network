markdown: kramdown
theme: minima
title: Public AI Network
description: A coalition to build public AI
author:
  name: Public AI Network
  email: info@publicai.network

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Theme-specific settings

minima:
  nav_pages:
  - libraries.md
  - seminar.md
  - contributing.md
  - publications.md
  - news.md
  - jobs/index.md
  # Set to `true` to show excerpts on the homepage.
  show_excerpts: true

collections:
  jobs:
    output: true
    permalink: /jobs/:name/

defaults:
  - scope:
      path: ""
      type: jobs
    values:
      layout: page

google_analytics: G-8CM1DYG2FB

# see https://github.com/jekyll/minima/blob/master/_config.yml for examples
